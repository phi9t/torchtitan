\* The stream edge is not inert on this instance: some rank holds two DISTINCT
\* communicators whose issues can land on one stream. Must be VIOLATED, at the
\* initial state.
\*
\* This replaces an exhaustive run with RequireStreamOrder = FALSE, which could
\* not fail: with the stream edge deleted, StuckByCircularWait is unsatisfiable
\* by construction. See the lemma above StreamEdgeIsInert in ScoutBModel.tla.
\* The runner pairs this with the StreamOfIssue(e) == e.comm substitution, which
\* is the design that made AtStreamHead redundant and must stop the violation.
CONSTANT
  Ranks <- Ranks2x2
  CommIds <- CommIds2x2
  CommMembers <- CommMembers2x2
  CommOps <- CommOps2x2

CONSTANT
  MaxIssues = 2
  RequireMatchedIssueOrder = TRUE
  RequireUniformProgramOps = TRUE
  RequireUniformProgramComms = TRUE
  RequireStreamOrder = TRUE

SPECIFICATION Spec

INVARIANT StreamEdgeIsInert

CONSTRAINT AtInitialState
CHECK_DEADLOCK FALSE
