\* Why the liveness property is conditioned at all. Every guard is on -- these
\* are the constants of DeviceMeshModel.cfg -- and the UNCONDITIONAL reading of
\* "every issued collective eventually completes" is still VIOLATED, because
\* Issue is unfair and a rank may simply stop issuing, leaving a peer's issue
\* short of its rendezvous forever. That is not a hang, so this refutation is
\* what justifies the AllIssued antecedent in EveryIssuedCollectiveCompletes.
CONSTANT
  Ranks <- Ranks2x2
  CommIds <- CommIds2x2
  CommMembers <- CommMembers2x2
  CommOps <- CommOps2x2

CONSTANT
  MaxIssues = 2
  RequireMatchedIssueOrder = TRUE
  RequireUniformProgramOps = TRUE
  RequireUniformProgramComms = TRUE
  RequireStreamOrder = TRUE

SPECIFICATION LiveSpec

PROPERTY EveryIssuedCollectiveCompletesUnconditionally

CHECK_DEADLOCK FALSE
