\* ORDER IS LOAD-BEARING, and pinned by
\* test_placement_negative_configurations_pin_their_invariant_order.
\*
\* These are constant expressions, so TLC reports only the FIRST listed
\* invariant that is FALSE and stops. Two consequences:
\*   - ThereIsAVolumeChangingCollective must come first, or facts with no
\*     volume-changing operation are reported against some other invariant and
\*     the missing-target control tests nothing.
\*   - DeviceMeshCollectivePayloadSizeRelation must come LAST. The attribution rests
\*     on the survivors being evaluated, and
\*     IssueOrderAgreementSurvivesTheMislabelling in particular IS the argument
\*     for having this check at all; put the relation earlier and that invariant
\*     is never reached.
SPECIFICATION Spec

INVARIANTS
  ThereIsAVolumeChangingCollective
  MutationIsIsolated
  StructureSurvivesTheMutation
  IssueOrderAgreementSurvivesTheMislabelling
  DeviceMeshCollectivePayloadSizeRelation
