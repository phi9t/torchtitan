\* The bridge's inputs, checked before anything is replayed: the derived
\* observed-to-model communicator mapping is a bijection that agrees with the
\* model on member sets and admissible operations, and the derived per-rank
\* issue sequences are orderable, equal in length, and long enough for the
\* replay bound. Every conjunct reads constants only, so the run is pinned to
\* the initial state; exploring the transition relation would add cost and no
\* evidence. This stage also measures what it costs to parse the 1.6 MB facts
\* module and fold the derivation.
CONSTANT
  Ranks <- Ranks2x2
  CommIds <- CommIds2x2
  CommMembers <- CommMembers2x2
  CommOps <- CommOps2x2

CONSTANT
  MaxIssues = 108
  RequireMatchedIssueOrder = TRUE
  RequireUniformProgramOps = TRUE
  RequireUniformProgramComms = TRUE
  RequireStreamOrder = TRUE
  GreedyReplay = TRUE
  MaxReplaySkew = 108
  MaxOutstanding = 108
  TransposeMutation = FALSE
  ReplayPermutation = "observed"

SPECIFICATION RSpec

INVARIANTS
  ModelInstanceIsNonEmpty
  ObservedRanksMatchTheModel
  ObservedIssueOrderIsDistinctWithinRank
  CommMappingIsWellFormed
  ReplayLengthsAgreeAcrossRanks
  ReplayBoundIsWithinTheObservedTrace
  TransposableIssuePairExists

CONSTRAINT AtInitialState
CHECK_DEADLOCK FALSE
