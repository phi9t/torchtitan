\* ORDER IS LOAD-BEARING, and pinned by
\* test_placement_negative_configurations_pin_their_invariant_order.
\*
\* These are constant expressions, so TLC reports only the FIRST listed
\* invariant that is FALSE and stops. Two consequences:
\*   - ThereIsADpShardPlacement must come first, or a degenerate facts module
\*     is reported against some other invariant and the missing-target control
\*     tests nothing.
\*   - ScoutBNoPartialAtOptimizer must come LAST. The attribution rests on the
\*     survivors being evaluated; put the Partial check earlier and the
\*     negative still classifies green while StructureSurvivesTheMutation and
\*     OtherPlacementChecksSurviveTheMutation are never reached.
SPECIFICATION Spec

INVARIANTS
  ThereIsADpShardPlacement
  MutationIsIsolated
  StructureSurvivesTheMutation
  OtherPlacementChecksSurviveTheMutation
  ScoutBNoPartialAtOptimizer
