\* Liveness, every guard on. Must HOLD.
\*
\* SPECIFICATION LiveSpec, not Spec: it adds weak fairness on Start and Complete
\* per communicator and deliberately leaves Issue unfair. See the LIVENESS
\* commentary in ScoutBModel.tla for why the property is conditioned on
\* AllIssued -- the unconditional reading is FALSE here, and
\* ScoutBModelLiveUnconditional.cfg keeps that refutation.
\*
\* FullBudgetRendezvousPopulated is checked alongside so the second antecedent
\* conjunct is measured to exclude no full-budget state in this configuration
\* rather than argued to.
\*
\* No CONSTRAINT: a state constraint under liveness checking can turn a pruned
\* state into a terminal node and manufacture a stuttering lasso. ModelBounded
\* would prune nothing, since IssueAllowed already enforces the bound, so it
\* buys nothing and is left out.
\*
\* CHECK_DEADLOCK FALSE, as in the relaxed configurations: ScoutBModel.cfg owns
\* the deadlock second opinion, the two liveness negatives need it off because a
\* stuck state is exactly what they look for, and keeping all three the same is
\* what lets the runner compare this cfg to the unconditional one and find only
\* the property changed.
CONSTANT
  Ranks <- Ranks2x2
  CommIds <- CommIds2x2
  CommMembers <- CommMembers2x2
  CommOps <- CommOps2x2

CONSTANT
  MaxIssues = 2
  RequireMatchedIssueOrder = TRUE
  RequireUniformProgramOps = TRUE
  RequireUniformProgramComms = TRUE
  RequireStreamOrder = TRUE

SPECIFICATION LiveSpec

PROPERTY EveryIssuedCollectiveCompletes

INVARIANT FullBudgetRendezvousPopulated

CHECK_DEADLOCK FALSE
