\* The decisive guard-isolation check: the SAME corrupted trace, the SAME
\* module, with RequireReadyGradients relaxed to FALSE and nothing else
\* changed. ObservedTraceIsNotAdmitted must now be VIOLATED, i.e. the whole
\* corrupted trace becomes admitted. That makes the refusal in
\* ScoutARefineBad.cfg attributable to that one guard directly, rather than
\* inferred from three weaker checks about where the refusal happened.
CONSTANT RequireReadyGradients = FALSE
SPECIFICATION RSpec
CHECK_DEADLOCK FALSE

INVARIANTS
  ControlEventsArePresent
  CorruptionIsIsolated
  ObservedTraceIsNotAdmitted
