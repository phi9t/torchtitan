\* The liveness negative: order divergence and nothing else, exactly the
\* relaxation of ScoutBModelDivergent.cfg. Must be VIOLATED, and the
\* counterexample is a LASSO rather than an invariant violation, which is why
\* the runner classifies it with formal_classify_tlc_liveness_negative.
\*
\* The ticket that asked for this named RequireUniformCommSchedule = FALSE. That
\* constant no longer exists; the site half of the SPMD-program guard is
\* RequireUniformProgramComms, and relaxing it is what produces a wait cycle
\* while operations still agree at every position.
\*
\* TLC reports the violation from a periodic liveness check on a partial state
\* graph, so this run leaves states on the queue. That is sound for exhibiting a
\* counterexample and is not an exhaustive statement about this configuration.
CONSTANT
  Ranks <- Ranks2x2
  CommIds <- CommIds2x2
  CommMembers <- CommMembers2x2
  CommOps <- CommOps2x2

CONSTANT
  MaxIssues = 2
  RequireMatchedIssueOrder = TRUE
  RequireUniformProgramOps = TRUE
  RequireUniformProgramComms = FALSE
  RequireStreamOrder = TRUE

SPECIFICATION LiveSpec

PROPERTY EveryIssuedCollectiveCompletes

CHECK_DEADLOCK FALSE
