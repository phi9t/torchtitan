\* ORDER IS LOAD-BEARING, and pinned by
\* test_placement_negative_configurations_pin_their_invariant_order.
\*
\* These are constant expressions, so TLC reports only the FIRST listed
\* invariant that is FALSE and stops. Two consequences:
\*   - ThereIsASizedWorkWithAPeer must come first, or facts with no eligible
\*     work are reported against some other invariant and the missing-target
\*     control tests nothing.
\*   - ScoutBCollectivePayloadAgreement must come LAST. The attribution rests
\*     on the survivors being evaluated; put the agreement check earlier and the
\*     negative still classifies green while StructureSurvivesTheMutation and
\*     OtherCollectiveChecksSurviveTheMutation are never reached.
SPECIFICATION Spec

INVARIANTS
  ThereIsASizedWorkWithAPeer
  MutationIsIsolated
  StructureSurvivesTheMutation
  OtherCollectiveChecksSurviveTheMutation
  ScoutBCollectivePayloadAgreement
