\* Order-sensitivity control, REFUSED half.
\*
\* One rank's issue sequence is reversed and the other three are left alone.
\* That breaks the columns: at the first position the scrambled rank is on the
\* communicator its last recorded collective used, while its peers are on
\* their first, and those two communicators share a rank. So this MUST be
\* refused -- ReplayedRunIsNotAdmitted must HOLD -- and
\* SingleRankPermutationBreaksAgreement says, through the model's own
\* predicates, that the input really is an agreement violation rather than
\* merely an unlucky one.
\*
\* This is the evidence that the bridge detects what NCCL imposes. The uniform
\* half above shows it does not, and should not, detect absolute order.
\*
\* Same constants as DeviceMeshRefineUniformPermutation.cfg except the
\* ReplayPermutation value.
CONSTANT
  Ranks <- Ranks2x2
  CommIds <- CommIds2x2
  CommMembers <- CommMembers2x2
  CommOps <- CommOps2x2

CONSTANT
  MaxIssues = 108
  RequireMatchedIssueOrder = TRUE
  RequireUniformProgramOps = TRUE
  RequireUniformProgramComms = TRUE
  RequireStreamOrder = TRUE
  GreedyReplay = TRUE
  MaxReplaySkew = 1
  MaxOutstanding = 108
  TransposeMutation = FALSE
  ReplayPermutation = "single_rank"

SPECIFICATION RSpec

INVARIANTS
  SingleRankPermutationIsNotTheObservedOrder
  SingleRankPermutationBreaksAgreement
  IssuedIsAReplayPrefix
  ReplayedRunIsNotAdmitted

CONSTRAINT ModelBounded
CHECK_DEADLOCK FALSE
