\* The safety configuration: every guard on, nothing relaxed.
\*
\* This is the only cfg that leaves TLC's own deadlock check enabled. Terminated
\* self-loops on AllDone only, so a stuck state with no successors is a TLC
\* deadlock report here, which is a free second opinion on the Stuck predicate.
\* The relaxed configurations set CHECK_DEADLOCK FALSE because a stuck state is
\* precisely what they are looking for, and the invariant they name is what must
\* classify it.
\*
\* StuckImpliesAllDone is the old, stronger "Stuck => AllDone" statement. It is
\* kept and still checked here, where it holds, rather than being deleted when
\* DeadlockFreedom was restated as the circular-wait property.
CONSTANT
  Ranks <- Ranks2x2
  CommIds <- CommIds2x2
  CommMembers <- CommMembers2x2
  CommOps <- CommOps2x2

CONSTANT
  MaxIssues = 2
  RequireMatchedIssueOrder = TRUE
  RequireUniformProgramOps = TRUE
  RequireUniformProgramComms = TRUE
  RequireStreamOrder = TRUE

SPECIFICATION Spec

INVARIANTS
  TypeOK
  RendezvousOpAgreement
  RendezvousMembership
  CommFifo
  DeadlockFreedom
  StuckImpliesAllDone

CONSTRAINT ModelBounded
