\* The decisive guard-isolation check: the SAME corrupted issue order, the
\* SAME module, with RequireMatchedIssueOrder relaxed to FALSE and nothing
\* else changed. ReplayedRunIsNotAdmitted must now be VIOLATED, i.e. the
\* corrupted run completes. That makes the refusal in DeviceMeshRefineBad.cfg
\* attributable to NCCL's matching requirement directly, rather than inferred
\* from where the refusal happened.
CONSTANT
  Ranks <- Ranks2x2
  CommIds <- CommIds2x2
  CommMembers <- CommMembers2x2
  CommOps <- CommOps2x2

CONSTANT
  MaxIssues = 108
  RequireMatchedIssueOrder = FALSE
  RequireUniformProgramOps = FALSE
  RequireUniformProgramComms = TRUE
  RequireStreamOrder = TRUE
  GreedyReplay = TRUE
  MaxReplaySkew = 1
  MaxOutstanding = 108
  TransposeMutation = TRUE
  ReplayPermutation = "observed"

SPECIFICATION RSpec

INVARIANTS
  TransposableIssuePairExists
  MutationIsIsolated
  ReplayedRunIsNotAdmitted

CONSTRAINT ModelBounded
CHECK_DEADLOCK FALSE
