\* Negative control: two ADJACENT issues of ONE rank on ONE communicator,
\* with differing operations, transposed. Nothing else changes.
\*
\* RequireUniformProgramOps is FALSE here and in the other two negative
\* configurations. The four ranks' observed operation sequences are
\* positionally identical, so a transposition on one rank makes the operations
\* disagree at a position with every other rank and the SPMD-program guard
\* would refuse the Issue itself -- a different guard than the one under test.
\* Relaxing it lets the corrupted order be issued, leaving the rendezvous
\* guard as the only thing that can refuse it.
\*
\* TransposableIssuePairExists is checked first so a trace with no such pair
\* reports as a missing target rather than as a passing control.
CONSTANT
  Ranks <- Ranks2x2
  CommIds <- CommIds2x2
  CommMembers <- CommMembers2x2
  CommOps <- CommOps2x2

CONSTANT
  MaxIssues = 108
  RequireMatchedIssueOrder = TRUE
  RequireUniformProgramOps = FALSE
  RequireUniformProgramComms = TRUE
  RequireStreamOrder = TRUE
  GreedyReplay = TRUE
  MaxReplaySkew = 1
  MaxOutstanding = 108
  TransposeMutation = TRUE
  ReplayPermutation = "observed"

SPECIFICATION RSpec

INVARIANTS
  TransposableIssuePairExists
  MutationIsIsolated
  ReplayedRunIsNotAdmitted
  MismatchedCollectiveNeverRuns

CONSTRAINT ModelBounded
CHECK_DEADLOCK FALSE
