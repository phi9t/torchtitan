\* Non-vacuity for the bounded-skew configuration: the same constants as
\* DeviceMeshRefineSkew.cfg, and the space it explores must contain a state with
\* two collectives in flight at once. Without this, a confluence claim could
\* rest on a space that happened to contain only serialized schedules, which
\* satisfy every guard trivially. NoTwoCollectivesRunConcurrently must be
\* VIOLATED. Deadlock detection is off here because the search stops at the
\* first witness and has not explored the space.
CONSTANT
  Ranks <- Ranks2x2
  CommIds <- CommIds2x2
  CommMembers <- CommMembers2x2
  CommOps <- CommOps2x2

CONSTANT
  MaxIssues = 54
  RequireMatchedIssueOrder = TRUE
  RequireUniformProgramOps = TRUE
  RequireUniformProgramComms = TRUE
  RequireStreamOrder = TRUE
  GreedyReplay = FALSE
  MaxReplaySkew = 2
  MaxOutstanding = 1
  TransposeMutation = FALSE
  ReplayPermutation = "observed"

SPECIFICATION RSpec

INVARIANT NoTwoCollectivesRunConcurrently

CONSTRAINT ModelBounded
CHECK_DEADLOCK FALSE
