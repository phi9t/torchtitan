\* The refinement itself: the observed issue order of all four ranks runs to
\* completion under every guard of ScoutBModel switched on.
\*
\* Polarity: TLC proves reachability by refutation, so the witness is a
\* VIOLATION of ReplayedRunIsNotAdmitted and the runner translates it into a
\* positive result token. IssuedIsAReplayPrefix is listed first so a replay
\* that stopped replaying the observed order reports as itself rather than as
\* a refusal.
\*
\* MaxReplaySkew bounds the SEARCH, not the protocol, and 1 means the replay
\* runs the four ranks in lockstep: no rank is ever two issues ahead of
\* another. The drain-then-advance policy does not impose that on its own --
\* ranks 0 and 3 share no communicator on this mesh, so nothing forces them
\* together and the unbounded search does visit a spread of two -- but the
\* witness survives the bound, and pruning those states makes the search
\* cheaper: measured 5,371 distinct states against 9,199 at a bound of 2 and
\* 13,261 at 4, with the same 865-step witness in every case.
CONSTANT
  Ranks <- Ranks2x2
  CommIds <- CommIds2x2
  CommMembers <- CommMembers2x2
  CommOps <- CommOps2x2

CONSTANT
  MaxIssues = 108
  RequireMatchedIssueOrder = TRUE
  RequireUniformProgramOps = TRUE
  RequireUniformProgramComms = TRUE
  RequireStreamOrder = TRUE
  GreedyReplay = TRUE
  MaxReplaySkew = 1
  MaxOutstanding = 108
  TransposeMutation = FALSE
  ReplayPermutation = "observed"

SPECIFICATION RSpec

INVARIANTS
  IssuedIsAReplayPrefix
  ReplaySkewIsWithinBound
  ReplayedRunIsNotAdmitted

CONSTRAINT ModelBounded
CHECK_DEADLOCK FALSE
