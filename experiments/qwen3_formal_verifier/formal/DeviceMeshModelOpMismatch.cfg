\* The other hazard, isolated: communicator sites still agree, only the
\* OPERATION may diverge between ranks. That reaches a hang whose cause is an
\* intra-communicator operation mismatch, reported under its own token so it
\* cannot be confused with the circular wait.
CONSTANT
  Ranks <- Ranks2x2
  CommIds <- CommIds2x2
  CommMembers <- CommMembers2x2
  CommOps <- CommOps2x2

CONSTANT
  MaxIssues = 2
  RequireMatchedIssueOrder = TRUE
  RequireUniformProgramOps = FALSE
  RequireUniformProgramComms = TRUE
  RequireStreamOrder = TRUE

SPECIFICATION Spec

INVARIANT NoOpMismatchHang

CONSTRAINT ModelBounded
CHECK_DEADLOCK FALSE
