\* The witness shape. Same constants as ScoutBModelDivergent.cfg -- only the
\* invariant differs -- so this pins what the deadlock found there actually is:
\* a cycle over at least two distinct communicators, operations agreeing, issue
\* counts equal on every communicator of the chain, and every rank at its full
\* budget. Must be VIOLATED.
CONSTANT
  Ranks <- Ranks2x2
  CommIds <- CommIds2x2
  CommMembers <- CommMembers2x2
  CommOps <- CommOps2x2

CONSTANT
  MaxIssues = 2
  RequireMatchedIssueOrder = TRUE
  RequireUniformProgramOps = TRUE
  RequireUniformProgramComms = FALSE
  RequireStreamOrder = TRUE

SPECIFICATION Spec

INVARIANT NoCrossCommunicatorCycleWitness

CONSTRAINT ModelBounded
CHECK_DEADLOCK FALSE
