\* Order-sensitivity control, ADMITTED half.
\*
\* Every rank's issue sequence is reversed. That is a permutation of the
\* POSITIONS applied uniformly to all four ranks, so it permutes whole columns
\* and every column is still a column: the operations still agree at each
\* position, the communicators are still at the same site wherever they share a
\* rank, and the induced collectives are the same multiset. The protocol
\* constrains cross-rank agreement, not absolute order, so this MUST be
\* admitted and ReplayedRunIsNotAdmitted must be VIOLATED.
\*
\* This configuration exists so the limit of the positive result is a recorded
\* fact rather than a caveat. Read it with the single-rank configuration, which
\* breaks the agreement and is refused; the pair is the statement.
\*
\* Same constants as ScoutBRefine.cfg except the ReplayPermutation value.
\* Every guard is on, exactly as in the positive.
CONSTANT
  Ranks <- Ranks2x2
  CommIds <- CommIds2x2
  CommMembers <- CommMembers2x2
  CommOps <- CommOps2x2

CONSTANT
  MaxIssues = 108
  RequireMatchedIssueOrder = TRUE
  RequireUniformProgramOps = TRUE
  RequireUniformProgramComms = TRUE
  RequireStreamOrder = TRUE
  GreedyReplay = TRUE
  MaxReplaySkew = 1
  MaxOutstanding = 108
  TransposeMutation = FALSE
  ReplayPermutation = "uniform"

SPECIFICATION RSpec

INVARIANTS
  UniformPermutationIsNotTheObservedOrder
  UniformPermutationPreservesAgreement
  IssuedIsAReplayPrefix
  ReplayedRunIsNotAdmitted

CONSTRAINT ModelBounded
CHECK_DEADLOCK FALSE
