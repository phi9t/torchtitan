\* Bounded-skew replay: the machine-checked form of the confluence argument.
\*
\* GreedyReplay is FALSE, so Start and Complete are unrestricted and the
\* search explores EVERY interleaving of the observed issue order whose
\* per-rank issue counts stay within MaxReplaySkew of one another -- including
\* the overlapping schedules the greedy path does not visit.
\*
\* CHECK_DEADLOCK is the instrument, and this is the only refinement
\* configuration that leaves it on. Terminated self-loops on AllDone alone and
\* the state graph is acyclic otherwise, so "no dead end anywhere in this
\* space" is exactly "every schedule in this space reaches completion". The
\* measure that makes the graph acyclic is written out under WHAT THE SKEW
\* CONFIGURATION ESTABLISHES in DeviceMeshRefine.tla.
\*
\* MaxIssues truncates the replay to the first issues of each rank, and
\* MaxOutstanding bounds work in flight. Those are the cost control, and they
\* are the whole reason this configuration is a FRAGMENT: it says nothing about
\* positions beyond the bound or about wider skew, and the runner reports every
\* bound so the result cannot be read as a claim about the full trace.
\*
\* 54 is chosen, not convenient. Rank 0's first reduce_scatter is at position
\* 52, so a shorter prefix contains no reduce_scatter at all: the rs stream
\* never appears, and neither does the alternation between FSDP2's two
\* dedicated streams on one communicator, which is what the stream-head
\* conjunct relates there. all_gather is in play from position 2 -- the ag
\* stream is NOT what this bound buys. 54 also covers the exact positions the
\* negative control transposes, 52 and 53. Measured: 53,405 distinct states in
\* about three and a half minutes at one worker. MaxIssues = 108 with the same
\* bounds does not finish in ten.
CONSTANT
  Ranks <- Ranks2x2
  CommIds <- CommIds2x2
  CommMembers <- CommMembers2x2
  CommOps <- CommOps2x2

CONSTANT
  MaxIssues = 54
  RequireMatchedIssueOrder = TRUE
  RequireUniformProgramOps = TRUE
  RequireUniformProgramComms = TRUE
  RequireStreamOrder = TRUE
  GreedyReplay = FALSE
  MaxReplaySkew = 2
  MaxOutstanding = 1
  TransposeMutation = FALSE
  ReplayPermutation = "observed"

SPECIFICATION RSpec

INVARIANTS
  IssuedIsAReplayPrefix
  ReplaySkewIsWithinBound
  ReplayOutstandingIsWithinBound
  TypeOK

CONSTRAINT ModelBounded
CHECK_DEADLOCK TRUE
