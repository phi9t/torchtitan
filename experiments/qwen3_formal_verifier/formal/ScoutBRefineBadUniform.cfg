\* The same corruption under the POSITIVE's guard set.
\*
\* The three configurations that isolate the rendezvous guard all relax
\* RequireUniformProgramOps, so none of them runs with the guards the positive
\* result was obtained under. This one does: every guard is on, and nothing
\* differs from ScoutBRefineBad.cfg but that constant and the invariants.
\*
\* The corruption is still refused -- ReplayedRunIsNotAdmitted holds -- and
\* CorruptedColumnIsNeverFormed says WHERE: no peer ever reaches the corrupted
\* position, so the communicator never becomes fully pending. The corrupted
\* record itself IS issued, because UniformProgramOpsOK compares positions only
\* up to the shorter of two sequences and the frontier position is not yet
\* compared; what the guard refuses is every peer's issue at that position.
\* That is the right refusal for an agreement violation, and it is the
\* real-world shape of the fault -- one rank ahead, its peers unable to follow
\* -- but it is not the rendezvous guard, which is why the isolation trio
\* relaxes the SPMD guard to reach it.
CONSTANT
  Ranks <- Ranks2x2
  CommIds <- CommIds2x2
  CommMembers <- CommMembers2x2
  CommOps <- CommOps2x2

CONSTANT
  MaxIssues = 108
  RequireMatchedIssueOrder = TRUE
  RequireUniformProgramOps = TRUE
  RequireUniformProgramComms = TRUE
  RequireStreamOrder = TRUE
  GreedyReplay = TRUE
  MaxReplaySkew = 1
  MaxOutstanding = 108
  TransposeMutation = TRUE
  ReplayPermutation = "observed"

SPECIFICATION RSpec

INVARIANTS
  TransposableIssuePairExists
  MutationIsIsolated
  ReplayedRunIsNotAdmitted
  CorruptedColumnIsNeverFormed

CONSTRAINT ModelBounded
CHECK_DEADLOCK FALSE
