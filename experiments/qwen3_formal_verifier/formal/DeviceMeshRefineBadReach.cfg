\* The same corruption, asking where the refusal lands. Rejection alone is
\* weak evidence: a corruption that broke the replay earlier would also be
\* refused. RejectionHappensBeforeTheRendezvous must be VIOLATED, which is the
\* witness that every collective before the corrupted rendezvous ran.
CONSTANT
  Ranks <- Ranks2x2
  CommIds <- CommIds2x2
  CommMembers <- CommMembers2x2
  CommOps <- CommOps2x2

CONSTANT
  MaxIssues = 108
  RequireMatchedIssueOrder = TRUE
  RequireUniformProgramOps = FALSE
  RequireUniformProgramComms = TRUE
  RequireStreamOrder = TRUE
  GreedyReplay = TRUE
  MaxReplaySkew = 1
  MaxOutstanding = 108
  TransposeMutation = TRUE
  ReplayPermutation = "observed"

SPECIFICATION RSpec

INVARIANTS
  TransposableIssuePairExists
  MutationIsIsolated
  RejectionHappensBeforeTheRendezvous

CONSTRAINT ModelBounded
CHECK_DEADLOCK FALSE
