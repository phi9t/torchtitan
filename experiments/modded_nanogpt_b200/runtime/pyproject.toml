[project]
name = "torchtitan-modded-nanogpt-b200-runtime"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "tqdm",
  "huggingface-hub",
  "datasets",
  "tiktoken",
  "typing-extensions",
  "setuptools",
  "kernels",
  "flash-attn==2.8.3.post1",
]

[tool.modded-nanogpt-b200-runtime]
torch_stack_owner = "rootfs"
torch_stack_policy = "Do not install torch, triton, or CUDA runtime replacement packages here."
