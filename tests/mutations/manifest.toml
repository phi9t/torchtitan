[[mutation]]
id = "placement-partial-choose-sentinel"
target = "experiments/qwen3_formal_verifier/formal/ScoutBPlacementPartialInvalid.tla"
test = "tests/unit_tests/test_formal_toolchain.py::test_the_derived_mutation_guard_is_load_bearing[partial_placement]"
find = '''MutatedPlacement ==
  IF ThereIsADpShardPlacement
  THEN CHOOSE placement \in DpShardPlacements :
         \A other \in DpShardPlacements :
           PlacementPosition[placement] <= PlacementPosition[other]
  ELSE ""'''
replace = '''MutatedPlacement ==
  CHOOSE placement \in DpShardPlacements :
    \A other \in DpShardPlacements :
      PlacementPosition[placement] <= PlacementPosition[other]'''
why = """
Reverts the CHOOSE sentinel guard on the derived mutation target. The guard
IS load bearing, but only where the sentinel invariant is unlisted: there the
guarded form degrades to a named invariant and the unguarded form abandons
the search at exit 75. The comment that justified the guard claimed exit 75
for the shipped cfg too; measured, both forms exit 151 there, because TLC
reports the constant-FALSE sentinel before forcing the CHOOSE.
"""

[[mutation]]
id = "bridge-length-only-admission"
target = "experiments/qwen3_formal_verifier/formal/ScoutBRefine.tla"
test = "tests/unit_tests/test_formal_toolchain.py::test_dpxtp_bridge_admission_is_stronger_than_the_issue_counts"
find = '''ReplayedRunIsNotAdmitted == ~AllDone'''
replace = '''ReplayedRunIsNotAdmitted ==
  ~(\A replayRank \in Ranks : Len(issued[replayRank]) = MaxIssues)'''
why = """
Replaces admission with the length-only reading. Issue's guard never reads
doneOn, so "every rank reached its observed issue count" is satisfiable by
issuing everything and running nothing -- for the CORRUPTED order too, which
would have made the bridge and its negative both pass vacuously. The test
that demonstrated the variant's reachability did not pin the shipped
predicate, so this entry's named test is new: it requires the shipped
predicate and the length-only one to disagree on a reachable state.
"""

[[mutation]]
id = "stream-of-issue-keyed-on-communicator"
target = "experiments/qwen3_formal_verifier/formal/ScoutBModel.tla"
test = "tests/unit_tests/test_formal_toolchain.py::test_dpxtp_instance_puts_distinct_communicators_on_one_rank_stream"
find = '''StreamOfIssue(e) ==
  CASE e.op = "all_gather"     -> "ag"
    [] e.op = "reduce_scatter" -> "rs"
    [] OTHER                   -> "compute"'''
replace = '''StreamOfIssue(e) == e.comm'''
why = """
Restores the provably-inert stream design: with one stream per communicator,
per-communicator FIFO already orders everything, AtStreamHead is redundant by
construction, and StuckByCircularWait is unsatisfiable at any bound on any
instance. An earlier version of the named test claimed to reconstruct
StreamOfIssue and never applied the stream map, so it passed under exactly
this mutation.
"""

[[mutation]]
id = "scout-b-valid-invariant-unbound"
target = "experiments/qwen3_formal_verifier/formal/ScoutBValid.cfg"
test = "tests/unit_tests/test_formal_toolchain.py::test_every_scout_b_valid_definition_is_bound_as_an_invariant"
find = '''
  ScoutBNoPartialAtOptimizer
'''
replace = "\n"
why = """
Drops one invariant from the positive configuration, leaving it defined in
ScoutBValid.tla and checked by nothing. The placement work added eight named
invariants at once, which is exactly where one silently fails to reach the
cfg; the named test derives both sides rather than searching for known names.
"""

[[mutation]]
id = "pre-commit-hook-unclassified"
target = ".pre-commit-config.yaml"
test = "tests/unit_tests/test_formal_toolchain.py::test_tier0_lint_classifies_every_pre_commit_hook"
find = '''    -   id: check-merge-conflict'''
replace = '''    -   id: check-merge-conflict
    -   id: mutation-manifest-unclassified-hook'''
why = """
Adds a hook that tier 0's loop does not run and the test's deferred set does
not name, which is how a hook gets skipped by tier 0 forever with nothing
noticing. The mutation is the one that forced the hook-classification test to
exist; it is re-run here because the tier-0 hook subset changes whenever the
gate's hook list does.
"""

