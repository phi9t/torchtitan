# Mutation manifest: (target file, textual mutation, expected failing test).
#
# Data only, on purpose. Adding an entry cannot introduce logic, so a new
# entry cannot bring its own escape hatch. tests/mutations/runner.py applies
# each `find` -> `replace` to a scratch copy of the tree, runs ONLY the named
# test there, and requires it to FAIL; then requires the same test to PASS on
# the unmutated copy. An entry whose mutation no longer kills its test is a
# defect in the test, not a reason to delete the entry.
#
# Fields:
#   id           unique slug, used in the QFV_MUT result line
#   target       repo-relative file the mutation rewrites
#   test         pytest node id, including a parametrize id where one test
#                case is enough to kill the mutation
#   find         exact text to replace; must occur `occurrences` times
#   replace      exact replacement; "" deletes the matched text
#   occurrences  required number of matches, default 1. A count rather than a
#                "replace what you find" rule, so an anchor that drifted or
#                got duplicated is an error instead of a silent near-miss.
#   why          what defect the mutation reintroduces, and where the original
#                measurement of it is recorded
#
# Every mutation here was applied and re-run against the change it guards
# before being recorded. None is invented. Append new entries at the end
# rather than rewriting the file, so concurrent work does not clobber it.

# ---------------------------------------------------------------------------
# 1-5. The five guards that were written in a shape that could not fail.
# ---------------------------------------------------------------------------

[[mutation]]
id = "tier0-gate-argument-arm"
target = "experiments/qwen3_formal_verifier/run_formal_tier0.sh"
test = "tests/unit_tests/test_formal_toolchain.py::test_tier0_runner_refuses_gate_and_unknown_arguments"
find = '''
    --output-root | --run-id | --attempt-id | --update-artifacts)
      usage >&2
      die "$1 is a gate argument; tier 0 seals no evidence bundle"
      ;;
'''
replace = ""
why = """
Deletes the gate-argument arm, so --output-root and friends fall into the
catch-all and are refused as "unknown argument". The refusal test asserted
only a non-zero exit and a usage banner, so deleting this whole arm left
every parametrized case passing -- 15 of them when that was recorded, 6 in
the test as it stands now. The test pins each case's diagnostic instead.
"""

[[mutation]]
id = "scout-a-model-branching-floor"
target = "experiments/qwen3_formal_verifier/formal/run_tlc_scout_a_model.sh"
test = "tests/unit_tests/test_formal_toolchain.py::test_model_runner_refuses_a_non_branching_specification"
find = '''  [[ "${safety_outdegree:-0}" -ge 2 ]] || {'''
replace = '''  [[ "${safety_outdegree:-0}" -ge 1 ]] || {'''
why = """
Lowers the branching floor to 1, which admits a cursor walking a recorded
sequence -- the replay design the abstract model exists to replace. The
original test asserted that the runner's TEXT contained "-ge 2", which would
have kept passing if the comparison were applied to a variable no TLC output
ever populated. The test now runs the real checker over a substituted
non-branching ScoutAModel.
"""

[[mutation]]
id = "skip-guard-ansi-strip"
target = "experiments/qwen3_formal_verifier/scout_a_runner_lib.sh"
test = "tests/unit_tests/test_qwen3_formal_scout_a.py::test_runner_library_skip_guard_refuses_only_undeclared_real_pytest_skips"
find = '''skip_lines="$(sed -e 's/\x1b\[[0-9;]*m//g' "${captured}" \
  | grep -E '^SKIPPED' || true)"'''
replace = '''skip_lines="$(cat "${captured}" \
  | grep -E '^SKIPPED' || true)"'''
why = """
Removes the ANSI strip, restoring grep -E "^SKIPPED" over coloured output
where it matched ZERO lines because pytest emits "\\x1b[33mSKIPPED". A gate
then passed partly BECAUSE the guard did nothing, after being "verified in
both directions" against hand-written plain text. The test now drives the
guard with output from a real pytest run that forces colour back on.
"""

[[mutation]]
id = "scout-b-model-coverage-ledger-by-name"
target = "experiments/qwen3_formal_verifier/formal/run_tlc_scout_b_model.sh"
test = "tests/unit_tests/test_formal_toolchain.py::test_dpxtp_model_coverage_ledger_records_only_byte_identical_inputs"
find = '''  if cmp --silent \
       "${work_dir}/${name}/${config}.cfg" "${fixture_dir}/${config}.cfg" \
     && cmp --silent \
       "${work_dir}/${name}/${module}.tla" "${fixture_dir}/${module}.tla"; then'''
replace = '''  if true; then'''
why = """
Restores recording by cfg NAME at invocation time, so the two stages that
deliberately run mutated copies satisfy coverage for the configs they mutate.
Deleting the honest run then still reported shipped=10 checked=10
unchecked=0. The byte-identity fix shipped with no test at all -- checking it
through the suite costs that target's whole 293s run -- so this entry's named
test extracts the runner's own run_tlc and executes it with a stub checker.
"""

[[mutation]]
id = "protocol-witness-claims-bound-none"
target = "experiments/qwen3_formal_verifier/formal/run_lean_scout_b_protocol.sh"
test = "tests/unit_tests/test_formal_toolchain.py::test_protocol_runner_reports_each_obligation_as_its_own_theorem_token"
find = '''  "cyclicWitnessIsStuck|${WITNESS2_LABEL}|witness-is-stuck"'''
replace = '''  "cyclicWitnessIsStuck|${THEOREM_LABEL}|witness-is-stuck"'''
why = """
Relabels a fixed-instance witness, decided at maxIssues = 2, as
scope=all-topologies-all-schedules bound=none. A blanket assertion that every
protocol token carries bound=none used to live in this test, which enshrined
that overclaim on 7 of the 20 tokens. The test now requires each token to
carry the vocabulary its result deserves, and refuses bound=none on anything
outside the general set.
"""

